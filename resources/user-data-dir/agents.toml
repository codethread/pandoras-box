# --- Policy packs -----------------------------------------------------------
# Declare policies before selecting them. Relative files resolve from this
# <user-data-dir>. files is a non-empty ordered array.
#
# [policies.git-flow]
# files = ["policies/git-flow.md"]
#
# [policies.war-style]
# files = ["policies/war-style.md"]
#
# [policy]
# add = ["git-flow"]
#
# [agents.war.policy]
# add = ["war-style"]

# --- Path-targeted rules ----------------------------------------------------
# Rules can target policy and Harness controls. This example defaults War to Pi
# above, but uses Claude for work repos and Pi for dev repos.
#
# [[rules]]
# path_glob = "~/work/**"
# policy.add = ["worktree-execution"]
# agents.war.harness.kind = "claude"
# agents.war.harness.model = "sonnet"
# agents.war.harness.argv.add = ["--effort", "high", "--name", "War"]
#
# [[rules]]
# path_glob = "~/dev/**"
# agents.war.harness.kind = "pi"
# agents.war.harness.model = "openai-codex/gpt-5.4"
# agents.war.harness.argv.replace = ["--name", "War"]
#
# [[rules]]
# scope_kind = "worktree"
# agent = "war"
# agents.war.policy.add = ["worktree-execution"]

# External intake no longer requires manifest configuration. While `pdx open`
# is running, write one JSON event per connection to $PDX_DATA_DIR/intake.sock:
# {"title":"Short signal title","body":"Details for Envy to triage"}
#
# harness.argv expansion: $PDX_DATA_DIR, ${PDX_DATA_DIR},
# $PDX_USER_DATA_DIR, ${PDX_USER_DATA_DIR}, ~, ~/... only; no shell eval.
