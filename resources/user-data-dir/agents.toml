# User-wide Pandora's Box manifest partial.
# Bundled Agent prompts stay fixed, but bundled config does not choose a
# Harness runtime. Configure at least Pandora before `pdx open`; configure the
# other Agents before they need to launch.
#
# Validate rendering with `pandora-spawn preview` before reopening the box.

# --- Pi Harness starter ----------------------------------------------------
# Uncomment and adjust for an all-Pi setup.
#
# [agents.pandora.harness]
# kind = "pi"
# model = "deepseek-v4-pro"
# system_prompt_mode = "replace"
# tools.add = ["bash", "read"]
#
# [agents.toil.harness]
# kind = "pi"
# model = "openai-codex/gpt-5.4"
# system_prompt_mode = "append"
# tools.add = ["bash", "read", "grep", "find", "ls", "subagent"]
#
# [agents.greed.harness]
# kind = "pi"
# model = "openai-codex/gpt-5.5"
# system_prompt_mode = "replace"
#
# [agents.war.harness]
# kind = "pi"
# model = "openai-codex/gpt-5.4"
# system_prompt_mode = "append"
#
# [agents.envy.harness]
# kind = "pi"
# model = "openai-codex/gpt-5.4"
# system_prompt_mode = "append"

# --- Claude Harness starter ------------------------------------------------
# Uncomment and adjust for an all-Claude setup. The plugin-dir example lets
